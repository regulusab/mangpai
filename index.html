<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>盲派八字論命</title><meta name="description" content="盲派八字排盤與命書：賓主、體用、做功、象法、應期，可下載 PDF 與 Word。">
<link rel="icon" href="./icon.png"><script src="https://regulusab.github.io/nav/nav.js" defer></script>  <script type="module" crossorigin src="/mangpai/assets/index-CrUGxVSg.js"></script>
  <link rel="stylesheet" crossorigin href="/mangpai/assets/index-DibbvqMS.css">
</head><body>
<header><h1>盲派八字論命</h1><p class="sub">排盤 · 賓主體用 · 做功 · 象法 · 應期 · 命書下載</p><p class="src">節氣：JPL DE421 星曆；日、時柱預設依鐘錶時間（可切換真太陽時）；東經 70° 以西依「干支換日線」</p></header>
<main>
<section class="card" id="formBox"><h2>命主資料</h2>
<div class="grid">
<label>姓名<input id="name" value="範例乾造" autocomplete="off"></label>
<label>性別<select id="gender"><option value="1">男（乾造）</option><option value="0">女（坤造）</option></select></label>
<label>出生日期（國曆）<input type="date" id="date" value="1988-06-15"></label>
<label>出生時間（當地鐘錶時間）<input type="time" id="time" value="09:30"></label>
<label>排盤時間口徑<select id="timeMode"><option value="clock" selected>鐘錶時間（預設）</option><option value="solar">真太陽時</option></select></label>
<label>出生城市（自動帶入經緯度、時區）<select id="city"></select></label>
<label>經度（東正西負）<input id="lon" type="number" step="0.01" value="121.56"></label>
<label>緯度（北正南負，僅記錄）<input id="lat" type="number" step="0.01" value="25.03"></label>
<label>當地時區（UTC 時差）<input id="tz" type="number" step="0.5" value="8"></label>
<label class="chk"><span><input type="checkbox" id="dst"> 出生時為夏令時間（扣 1 小時）</span></label>
<label>流年（論斷年份）<input id="year" type="number" min="1900" max="2100"></label>
</div>
<div class="row"><button id="calc" class="pri">排盤</button><button id="gen" class="pri2">產生命書</button></div>
<p id="note" class="muted"></p></section>
<nav id="tabs"><button data-t="chart" class="on">命盤</button><button data-t="book">命書</button><button data-t="refs">參考資料</button></nav>
<section id="chart" class="pane on"><div id="p1" class="paper"></div><div id="brief" class="card"></div></section>
<section id="book" class="pane"><div class="row noprint bar"><button id="dlPdf" class="pri" disabled>下載 PDF</button><button id="dlDoc" disabled>下載 Word</button><button id="prt" disabled>列印</button><span id="bookMsg" class="muted">請按「產生命書」。</span></div><article id="bookBody" class="report"></article></section>
<section id="refs" class="pane"></section>
<footer>※ 本站內容依盲派與傳統命理規則自動推算，僅供參考，不構成醫療、法律、投資或其他專業建議。理法摘要與引文出處見「參考資料」。</footer>
</main></body></html>
